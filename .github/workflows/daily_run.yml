name: Daily GitHub Trending Push

on:
  schedule:
    # UTC 时间 01:00 运行（对应北京/马来西亚时间每天早上 09:00）
    - cron: '0 1 * * *'
  # 保留手动触发按钮，方便随时在 GitHub Actions 页面进行调试
  workflow_dispatch:

# 赋予 GitHub Actions 自动 Git Commit/Push 的写权限
permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取仓库代码
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. 设置 Python 环境
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. 安装依赖
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # 4. 运行 Python 主脚本
      - name: Run Main Script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          python main.py

      # 5. 自动提交并保存去重文件 pushed_history.json 回仓库
      - name: Save Pushed History Back to Repo
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add pushed_history.json
          git commit -m "Auto-update pushed history [skip ci]" || echo "No changes to commit"
          git push || echo "No changes to push"
